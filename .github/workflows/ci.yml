# =============================================================================
# AppGate Dev-Portal — CI Pipeline
#
# Runs on every push and PR: lint, test, build Go + React, Docker images.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Go — lint, test, build
  # ---------------------------------------------------------------------------
  go:
    name: Go (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m ./...

      - name: Test
        run: go test -v -count=1 -race ./...

      - name: Build BFF
        run: go build -o /dev/null ./apps/api

      - name: Build Control Plane
        working-directory: control-plane-ext
        run: go build -o /dev/null ./cmd/server

  # ---------------------------------------------------------------------------
  # Web — lint, build
  # ---------------------------------------------------------------------------
  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker — build images (no push, just verify)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker (build verify)
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f deploy/docker/api.Dockerfile -t appgate/dev-portal-api:ci .

      - name: Build Web image
        run: docker build -f deploy/docker/web.Dockerfile -t appgate/dev-portal-web:ci .

      - name: Build Control Plane image
        run: docker build -f control-plane-ext/Dockerfile -t appgate/control-plane:ci .