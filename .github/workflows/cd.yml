# =============================================================================
# AppGate Dev-Portal — CD Pipeline
#
# On push to main: build, tag, and push Docker images to GitHub Container
# Registry (ghcr.io). No env files are used — secrets injected via GH secrets.
# =============================================================================

name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  GO_VERSION: '1.22'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Verify — run tests before building images
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go test
        run: go test -v -count=1 ./...

      - name: Go build
        run: go build -o /dev/null ./apps/api

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Web build
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # ---------------------------------------------------------------------------
  # Push — build and push Docker images
  # ---------------------------------------------------------------------------
  push:
    name: Push Docker Images
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/dev-portal-api
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/dev-portal-web
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/control-plane
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Control Plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-plane-ext/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}